<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salma Branch Inventory</title>
    <link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="dark-mode">

    <!-- Splash Screen -->
    <div id="splash-screen">
        <h2>جاري تحميل جرد سلمى...</h2>
    </div>

    <!-- Main Container -->
    <div id="app-container" class="hidden">
        
        <!-- Header -->
        <header>
            <div class="header-left">
                <h1>جرد فرع سلمى</h1>
                <span id="branch-display-tag" class="branch-tag">فرع: جاري التحميل...</span>
            </div>
            <div class="header-actions">
                <button onclick="toggleTheme()" class="btn-theme">🌓 المظهر</button>
                <button onclick="openAdminModal()" class="btn-admin">⚙️ الإدارة</button>
            </div>
        </header>

        <!-- Navigation Tabs for Categories -->
        <nav id="tabs-wrapper" class="tabs-container"></nav>

        <!-- Dynamic Category Title -->
        <h2 id="category-title" class="section-title">--</h2>

        <!-- Table View -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>الصنف</th>
                        <th>التاريخ</th>
                        <th onclick="requestColumnUnlock('received')" class="clickable-header">
                            مستلم <span id="lock-icon-rec">🔒</span>
                        </th>
                        <th>جديد</th>
                        <th onclick="requestColumnUnlock('delivered')" class="clickable-header">
                            مسلم <span id="lock-icon-del">🔒</span>
                        </th>
                        <th>العدد النهائي</th>
                        <th>ملاحظات</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </div>

        <!-- Submit & Sync Action Button -->
        <div class="action-footer">
            <button onclick="handleSaveAndExport()" class="btn-submit">💾 حفظ وتصدير للسحابة (الرئيسي)</button>
        </div>
    </div>

    <!-- Column Password Unlock Modal -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title">فتح العمود</h3>
            <p id="modal-prompt-text">أدخل كلمة المرور:</p>
            <input type="password" id="modal-password-input" placeholder="****">
            <div class="modal-actions">
                <button onclick="verifyPasswordAction()" class="btn-confirm">تاكيد</button>
                <button onclick="closePasswordModal()" class="btn-cancel">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Settings Modal -->
    <div id="admin-modal" class="modal-overlay">
        <div class="modal-card admin-card">
            <h3>لوحة تحكم المشرف</h3>
            
            <div id="admin-login-view">
                <p>أدخل كلمة مرور المشرف:</p>
                <input type="password" id="admin-master-input" placeholder="****">
                <div class="modal-actions">
                    <button onclick="verifyAdminLogin()" class="btn-confirm">دخول</button>
                    <button onclick="closeAdminModal()" class="btn-cancel">إلغاء</button>
                </div>
            </div>

            <div id="admin-settings-view" style="display:none;">
                <div class="admin-section">
                    <h4>بيانات الفرع</h4>
                    <label>اسم الفرع:</label>
                    <input type="text" id="branch-name-edit">
                    <label>رقم الهاتف:</label>
                    <input type="text" id="branch-phone-edit">
                </div>

                <div class="admin-section">
                    <h4>تعديل كلمات المرور</h4>
                    <label>كلمة مرور (مستلم):</label>
                    <input type="text" id="pass-received-edit">
                    <label>كلمة مرور (مسلم):</label>
                    <input type="text" id="pass-delivered-edit">
                    <label>كلمة مرور (المشرف):</label>
                    <input type="text" id="pass-admin-edit">
                </div>

                <div class="admin-section">
                    <h4>إدارة الأصناف والقوائم</h4>
                    <div class="crud-block">
                        <label>إضافة صنف جديد:</label>
                        <select id="add-item-category-select"></select>
                        <input type="text" id="new-item-name-input" placeholder="اسم الصنف الجديد">
                        <button onclick="addNewItem()" class="btn-sm">إضافة صنف</button>
                    </div>

                    <div class="crud-block">
                        <label>حذف صنف:</label>
                        <select id="del-item-category-select" onchange="populateItemsForDeletion()"></select>
                        <select id="del-item-name-select"></select>
                        <button onclick="deleteSelectedItem()" class="btn-sm btn-danger">حذف الصنف</button>
                    </div>

                    <div class="crud-block">
                        <label>إضافة قائمة (تصنيف) جديد:</label>
                        <input type="text" id="new-category-name-input" placeholder="اسم القائمة الجديدة">
                        <button onclick="addNewCategory()" class="btn-sm">إضافة قائمة</button>
                    </div>

                    <div class="crud-block">
                        <label>حذف قائمة بالكامل:</label>
                        <select id="del-category-select"></select>
                        <button onclick="deleteSelectedCategory()" class="btn-sm btn-danger">حذف القائمة</button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button onclick="saveAdminSettings()" class="btn-confirm">حفظ الإعدادات</button>
                    <button onclick="closeAdminModal()" class="btn-cancel">إغلاق</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
